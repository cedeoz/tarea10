<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarea 10</title>

    <style>
        #contenedor{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 110px);
            grid-template-areas:
                "uno dos   dos   tres"
                "uno cinco siete cuatro"
                "uno ocho  seis  cuatro";
            gap: 10px;
            max-width: 850px;
            margin: 50px auto;
            padding: 12px;
            border: 1px solid #475569;
        }

        .caja{
            display: grid;
            place-items: center;
            color: white;
            font-weight: bold;
            border: 1px solid #334155;
        }

        .uno{
            grid-area: uno;    background-color: #1e40af; 
        }
        .dos{
            grid-area: dos;    background-color: #6d28d9;
        }
        .tres{
            grid-area: tres;   background-color: #be123c;
        }
        .cuatro{
            grid-area: cuatro; background-color: #0f766e; }
        .cinco{
            grid-area: cinco;  background-color: #9a3412;
        }
        .seis{
            grid-area: seis;   background-color: #a21caf;
        }
        .siete{
            grid-area: siete;  background-color: #166534;
        }
        .ocho{
            grid-area: ocho;   background-color: #475569;
        }
    </style>
</head>
<body>
    <h1>grid</h1>

    <div id="contenedor">
        <div class="caja uno">UNO</div>
        <div class="caja dos">DOS</div>
        <div class="caja tres">TRES</div>
        <div class="caja cuatro">CUATRO</div>
        <div class="caja cinco">CINCO</div>
        <div class="caja seis">SEIS</div>
        <div class="caja siete">SIETE</div>
        <div class="caja ocho">OCHO</div>
    </div>
</body>
</html>
